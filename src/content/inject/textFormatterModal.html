<template id="textFormatterModalTemplate">
    <div id="text-formatter-modal-overlay"></div>
    <div id="textFormatterModal">

        <div id="textFormatterNavTabs" class="textFormatterNavTabs">
            <div id="translation-tab" isTabSelected="true" tfTabindex="1" class="textFormatterNavTabSelected">
                Translation</div>
            <div id="typography-tab" isTabSelected="false" tfTabindex="2" class="textFormatterNavTab">Typography</div>
            <div id="color-tab" isTabSelected="false" tfTabindex="3" class="textFormatterNavTab">Color</div>
        </div>

        <div class="screensContainerParent">
            <div class="screensContainer" style="display: block;">
                <div>
                    <div id="text-formatter-modal-formatted-text">Please select a translation, typography, and color.
                    </div>
                </div>

                <!-- Translation Screen -->
                <div id="translation-screen">
                    <div class="text-formatter-modal-translation-search-input-parent">
                        <svg width="1rem" height="1rem" style="color: var(--gray-500);" aria-hidden="true"
                            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
                        </svg>
                        <input class="text-formatter-modal-translation-search-input"
                            placeholder="Search Translation..." />
                    </div>

                    <table id="text-formatter-modal-translations-table" class="tableWrapper">
                        <thead>
                            <tr>
                                <th>Key</th>
                                <th id="text-formatter-modal-translations-table-default-language">Translation (en)</th>
                            </tr>
                        </thead>
                        <tbody class="text-formatter-modal-translations-table-body"></tbody>
                    </table>

                    <div class="no-translations-screen">
                        <div class="content">
                            <p>Oops !!</p>
                            <p>No translation data found</p>
                        </div>
                    </div>

                </div>

                <!-- Typography Screen -->
                <div id="typography-screen" style="display: none;">
                    <table id="text-formatter-modal-typography-table" class="tableWrapper">
                        <thead>
                            <tr>
                                <th>Typography Name</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody class="text-formatter-modal-typography-table-body"></tbody>
                    </table>

                    <div class="no-typography-screen">
                        <div class="content">
                            <p>Oops !!</p>
                            <p>No typography data found</p>
                        </div>
                    </div>
                </div>

                <!-- Color Screen -->
                <div id="color-screen" style="display: none;">
                    <div class="text-formatter-modal-color-search-input-parent">
                        <svg width="1rem" height="1rem" style="color: var(--gray-500);" aria-hidden="true"
                            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
                        </svg>
                        <input class="text-formatter-modal-color-search-input" placeholder="Search Color..." />
                    </div>

                    <table id="text-formatter-modal-colors-table" class="tableWrapper">
                        <thead>
                            <tr>
                                <th>Semantic Name</th>
                                <th class="text-formatter-modal-color-theme-mode">Light Theme</th>
                            </tr>
                        </thead>
                        <tbody class="text-formatter-modal-colors-table-body"></tbody>
                    </table>

                    <div class="no-colors-screen">
                        <div class="content">
                            <p>Oops !!</p>
                            <p>No colors data found</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-formatter-modal-buttons-parent">
            <div id="hide-text-formatter-modal" class="buttonRed" style="width: 40%;">Close</div>
            <div id="text-formatter-modal-apply-button" class="buttonBlue disabled" style="width: 40%;">Apply</div>
        </div>

    </div>
</template>
