<div id="project-settings-screen" class="hidden h-full">
  <!-- header -->
  <div class="flex items-center p-4 md:p-5 border-b rounded-t  border-gray-200">
    <button id="project-settings-back-button" type="button"
      class="text-white bg-blue-700 hover:bg-blue-800 me-2 font-medium rounded-full text-sm p-2.5 text-center">
      <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M5 12h14M5 12l4-4m-4 4 4 4" />
      </svg>
      <span class="sr-only">Icon description</span>
    </button>
    <div class="flex-1">
      <h3 class="text-lg font-extrabold ">Settings</h3>
      <p id="project-name-settings-screen" class="text-xs text-gray-500 ">Project name</p>
    </div>
  </div>
  <!-- body -->


  <div id="project-settings-home-page" class="space-y-6 p-6">
    <!-- General Section -->
    <section>
      <h2 class="text-lg font-semibold text-gray-900 mb-4 tracking-tight">General</h2>

      <div class="divide-y divide-gray-200 rounded-xl overflow-hidden border border-gray-200">
        <!-- Item -->
        <div id="general-project-details"
          class="group flex items-center justify-between px-4 py-3 bg-white hover:bg-gray-50 transition">
          <span class="text-sm text-gray-700 group-hover:text-gray-900 font-medium">Project Details</span>
          <svg class="w-4 h-4 text-gray-400 group-hover:text-gray-600 transition" fill="none" stroke="currentColor"
            stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </div>

        <div id="general-project-duplication"
          class="group flex items-center justify-between px-4 py-3 bg-white hover:bg-gray-50 transition">
          <span class="text-sm text-gray-700 group-hover:text-gray-900 font-medium">Project Duplication</span>
          <svg class="w-4 h-4 text-gray-400 group-hover:text-gray-600 transition" fill="none" stroke="currentColor"
            stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </div>

        <div id="general-project-deletion"
          class="group flex items-center justify-between px-4 py-3 bg-red-200 hover:bg-red-400 transition">
          <span class="text-sm text-red-700 group-hover:text-red-800 font-medium">Project Deletation</span>
          <svg class="w-4 h-4 text-red-500 group-hover:text-red-700 transition" fill="none" stroke="currentColor"
            stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </div>
      </div>
    </section>

    <!-- Export Section -->
    <section>
      <h2 class="text-lg font-semibold text-gray-900 mb-4 tracking-tight">Export</h2>

      <div class="divide-y divide-gray-200 rounded-xl overflow-hidden border border-gray-200">
        <!-- Colors -->
        <div
          class="group flex items-center justify-between px-4 py-3 bg-white hover:bg-gray-50 transition cursor-pointer">
          <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">Colors</span>
          <div class="flex gap-2">
            <button id="copy-colors" aria-label="Copy Colors"
              class="p-1.5 rounded-md bg-gray-100 hover:bg-gray-200 transition" type="button">
              <svg class="w-3.5 h-3.5 text-gray-700 group-hover:text-gray-900" fill="none" stroke="currentColor"
                stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2M16 8h2a2 2 0 012 2v8a2 2 0 01-2 2h-8a2 2 0 01-2-2v-2" />
              </svg>
            </button>

            <button id="download-colors" aria-label="Download Colors"
              class="p-1.5 rounded-md bg-blue-600 hover:bg-blue-700 transition" type="button">
              <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="1.5"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V4" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Typography -->
        <div
          class="group flex items-center justify-between px-4 py-3 bg-white hover:bg-gray-50 transition cursor-pointer">
          <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">Typography</span>
          <div class="flex gap-2">
            <button id="copy-typography" aria-label="Copy Typography"
              class="p-1.5 rounded-md bg-gray-100 hover:bg-gray-200 transition" type="button">
              <svg class="w-3.5 h-3.5 text-gray-700 group-hover:text-gray-900" fill="none" stroke="currentColor"
                stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2M16 8h2a2 2 0 012 2v8a2 2 0 01-2 2h-8a2 2 0 01-2-2v-2" />
              </svg>
            </button>

            <button id="download-typography" aria-label="Download Typography"
              class="p-1.5 rounded-md bg-blue-600 hover:bg-blue-700 transition" type="button">
              <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="1.5"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V4" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Translations -->
        <div
          class="group flex items-center justify-between px-4 py-3 bg-white hover:bg-gray-50 transition cursor-pointer">
          <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900">Translations</span>
          <div class="flex gap-2">
            <button id="copy-translations" aria-label="Copy Translations"
              class="p-1.5 rounded-md bg-gray-100 hover:bg-gray-200 transition" type="button">
              <svg class="w-3.5 h-3.5 text-gray-700 group-hover:text-gray-900" fill="none" stroke="currentColor"
                stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2M16 8h2a2 2 0 012 2v8a2 2 0 01-2 2h-8a2 2 0 01-2-2v-2" />
              </svg>
            </button>

            <button id="download-translations" aria-label="Download Translations"
              class="p-1.5 rounded-md bg-blue-600 hover:bg-blue-700 transition" type="button">
              <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="1.5"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V4" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Import Section -->
    <section>
      <h2 class="text-lg font-semibold text-gray-900 mb-4 tracking-tight">Import</h2>

      <div class="divide-y divide-gray-200 rounded-xl overflow-hidden border border-gray-200">
        <!-- Item -->
        <div id="import-color-themes-button"
          class="group flex items-center justify-between px-4 py-3 bg-white hover:bg-gray-50 transition">
          <span class="text-sm text-gray-700 group-hover:text-gray-900 font-medium">Color Themes</span>
          <svg class="w-4 h-4 text-gray-400 group-hover:text-gray-600 transition" fill="none" stroke="currentColor"
            stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </div>

        <div id="import-typography-button"
          class="group flex items-center justify-between px-4 py-3 bg-white hover:bg-gray-50 transition">
          <span class="text-sm text-gray-700 group-hover:text-gray-900 font-medium">Typography</span>
          <svg class="w-4 h-4 text-gray-400 group-hover:text-gray-600 transition" fill="none" stroke="currentColor"
            stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </div>

        <div id="import-translations-button"
          class="group flex items-center justify-between px-4 py-3 bg-white hover:bg-gray-50 transition">
          <span class="text-sm text-gray-700 group-hover:text-gray-900 font-medium">Translations</span>
          <svg class="w-4 h-4 text-gray-400 group-hover:text-gray-600 transition" fill="none" stroke="currentColor"
            stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </div>
      </div>
    </section>



  </div>

  <div id="project-settings-details-page" class="hidden p-4 md:p-5">
    <div class="grid gap-4 mb-4 grid-cols-2">
      <div class="col-span-2">
        <label for="project-details-name-input" class="block mb-2 text-sm font-medium text-gray-900 ">Project
          name</label>
        <label id="project-details-name-input-error" class="hidden text-xs text-red-500 mb-1"></label>
        <input type="text" name="project-details-name-input" id="project-details-name-input"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg  block w-full p-2.5 dark:bg-gray-600  "
          placeholder="Type Project name" required="">
      </div>
      <div class="col-span-2 sm:col-span-1">
        <label for="project-details-author-input" class="block mb-2 text-sm font-medium text-gray-900 ">Author</label>
        <label id="project-details-author-input-error" class="hidden text-xs text-red-500 mb-1"></label>
        <input type="text" name="project-details-author-input" id="project-details-author-input"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg  block w-full p-2.5 dark:bg-gray-600  "
          placeholder="Type Author Name" required="">
      </div>
      <div class="col-span-2 sm:col-span-1">
        <label for="project-details-version-input" class="block mb-2 text-sm font-medium text-gray-900 ">Version</label>
        <label id="project-details-version-input-error" class="hidden text-xs text-red-500 mb-1"></label>
        <input type="text" name="project-details-version-input" id="project-details-version-input"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg  block w-full p-2.5 dark:bg-gray-600  "
          placeholder="Type Version Name" required="">
      </div>
    </div>
    <button id="project-details-action-button"
      class="text-white inline-flex items-center bg-gray-500 hover:bg-gray-600   font-medium rounded-lg text-sm px-5 py-2.5 text-center "
      disabled>
      <svg class="me-1 -ms-1 w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd"
          d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd">
        </path>
      </svg>
      Save Changes
    </button>

  </div>

  <div id="project-settings-duplication-page" class="hidden p-4 md:p-5">
    <div class="grid gap-4 mb-4 grid-cols-2">
      <div class="col-span-2">
        <label for="project-duplicate-name-input" class="block mb-2 text-sm font-medium text-gray-900 ">New Project
          Name</label>
        <label id="project-duplicate-name-input-error" class="hidden text-xs text-red-500 mb-1"></label>
        <input type="text" name="project-duplicate-name-input" id="project-duplicate-name-input"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg  block w-full p-2.5 dark:bg-gray-600  "
          placeholder="Type New Project name" required="">
      </div>
    </div>
    <button id="project-duplicate-action-button"
      class="text-white inline-flex items-center bg-gray-500 hover:bg-gray-600   font-medium rounded-lg text-sm px-5 py-2.5 text-center "
      disabled>
      Duplicate Project
    </button>

  </div>

  <div id="project-settings-deletion-page" class="hidden p-4 md:p-5">
    <div class="grid gap-4 mb-4 grid-cols-2">
      <div class="col-span-2">
        <label for="project-delete-name-input" class="block mb-2 text-sm font-medium text-gray-900">
          Project Name
        </label>

        <!-- Disclaimer message -->
        <p id="project-delete-disclaimer" class="mb-2 text-xs text-gray-700">
          To confirm deletion, please type
          <strong id="deletion-project-name" class="inline-block bg-red-200 text-red-600 px-2 py-0.5 rounded">
            <!-- Project name will be inserted here -->
          </strong>
          below. This action is irreversible.
        </p>


        <input type="text" name="project-delete-name-input" id="project-delete-name-input"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full p-2.5 dark:bg-gray-600"
          placeholder="Type project name to confirm deletion" required="">
      </div>
    </div>

    <button id="project-delete-action-button"
      class="text-white inline-flex items-center bg-gray-500 hover:bg-gray-600 font-medium rounded-lg text-sm px-5 py-2.5 text-center"
      disabled>
      Delete Project
    </button>
  </div>


</div>
